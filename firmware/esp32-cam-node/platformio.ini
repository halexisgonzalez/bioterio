; Proyecto PlatformIO - Nodo ESP32-CAM para tracking de bioterio
; Placa: AI-Thinker ESP32-CAM (la que trae el kit de Nagame Electrónica / la mayoría de kits ESP32-CAM)
;
; Requisitos:
;   - VSCode + extensión "PlatformIO IDE"  (o el CLI: pip install platformio)
;   - La placa base programadora (Esp32-cam-mb) o un adaptador USB-TTL
;
; Comandos útiles (desde esta carpeta):
;   pio run                -> compila
;   pio run -t upload      -> compila y flashea
;   pio device monitor      -> abre el monitor serie (115200 baud)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Habilita RTTI/excepciones no son necesarias; dejamos flags mínimos.
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Descomentar si se habilita el sensor de temperatura DS18B20 (ENABLE_TEMP_SENSOR 1 en config.h)
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
