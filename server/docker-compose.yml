services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bioterio}
      MYSQL_USER: ${MYSQL_USER:-bioterio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bioterio}
    ports:
      # 3307 en el host para no chocar con un MySQL local ya instalado en
      # 3306. Si no tenés otro MySQL corriendo, podés cambiarlo a "3306:3306".
      - "3307:3306"
    volumes:
      - bioterio_mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bioterio_mysql_data:
