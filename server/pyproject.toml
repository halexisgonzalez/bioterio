[project]
name = "bioterio-server"
version = "0.1.0"
description = "Servidor central: ingesta multi-nodo, detección/tracking y persistencia en MySQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bioterio-tools",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "ultralytics>=8.3",
]

# Solo hace falta para bajar un modelo entrenado de Roboflow Universe
# (scripts/download_roboflow_model.py) — no es necesario para correr el
# servidor ni el detector v1, por eso queda como extra separado.
[project.optional-dependencies]
roboflow = ["roboflow>=1.1"]

[project.scripts]
bioterio-server = "bioterio_server.main:main"
bioterio-debug-view = "bioterio_server.debug_view:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioterio_server"]

[tool.uv.sources]
bioterio-tools = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
]
